fragment BotFields on Bot {
  id
  key
  name
  description
  personality
  model
  custom
  instructions
  outfit
}

fragment AlertFields on Alert {
  id
  kind
  read
  sent
  message
  href
}

query BotAlerts($key: BotKey!) {
  bot(key: $key) {
    id
    alerts {
      ...AlertFields
    }
  }
}

fragment ProposalFields on Proposal {
  id
  action
  kind
  status
  title
  lines {
    label
    value
  }
  fields {
    key
    kind
    label
    value
    options {
      value
      label
    }
  }
  recordId
}

fragment MessageFields on Message {
  id
  role
  content
  attachments {
    kind
    name
  }
  createdAt
  proposals {
    ...ProposalFields
  }
}

query Bots {
  aiStatus {
    configured
    defaultModel
  }
  bots {
    ...BotFields
    recentJobs(limit: 3) {
      ...JobFields
    }
    alerts {
      ...AlertFields
    }
    alertsConversation {
      id
    }
  }
}

query Models {
  models {
    id
    name
    free
  }
}

query BotPanel($key: BotKey!) {
  aiStatus {
    configured
  }
  bot(key: $key) {
    ...BotFields
  }
}

query Conversations($botId: ID) {
  conversations(botId: $botId) {
    id
    title
    alerts
    channel
    updatedAt
    bot {
      id
      key
      name
    }
    lastMessage {
      role
      content
    }
  }
}

query Conversation($id: ID!) {
  conversation(id: $id) {
    id
    title
    replying
    messages {
      ...MessageFields
    }
  }
}

mutation SetBotModel($id: ID!, $model: String) {
  setBotModel(id: $id, model: $model) {
    ...BotFields
  }
}

mutation StartConversation($botId: ID!) {
  startConversation(botId: $botId) {
    id
    title
    updatedAt
  }
}

mutation DeleteConversation($id: ID!) {
  deleteConversation(id: $id)
}

mutation StopReply($conversationId: ID!) {
  stopReply(conversationId: $conversationId)
}

mutation ConfirmProposal($id: ID!) {
  confirmProposal(id: $id) {
    ...ProposalFields
  }
}

mutation EditProposal($id: ID!, $values: [RecordValueInput!]!) {
  editProposal(id: $id, values: $values) {
    ...ProposalFields
  }
}

mutation CancelProposal($id: ID!) {
  cancelProposal(id: $id) {
    ...ProposalFields
  }
}

mutation MarkAlertsRead($bot: BotKey!, $ids: [ID!]!) {
  markAlertsRead(bot: $bot, ids: $ids) {
    id
    alerts {
      ...AlertFields
    }
  }
}

mutation DismissAlert($bot: BotKey!, $id: ID!) {
  dismissAlert(bot: $bot, id: $id) {
    id
    alerts {
      ...AlertFields
    }
  }
}

"The Agentes the app switches between, fixed ones first (docs/adr/0035)."
query Agents {
  aiStatus {
    configured
  }
  billing {
    plan {
      key
      agents
    }
  }
  bots {
    ...BotFields
  }
}

query AgentPanel($id: ID!) {
  aiStatus {
    configured
  }
  botById(id: $id) {
    ...BotFields
  }
}

mutation CreateBot($input: AgentInput!) {
  createBot(input: $input) {
    ...BotFields
  }
}

mutation UpdateBot($id: ID!, $input: AgentInput!) {
  updateBot(id: $id, input: $input) {
    ...BotFields
  }
}

mutation DeleteBot($id: ID!) {
  deleteBot(id: $id)
}

mutation DeliverAlerts($bot: BotKey!) {
  deliverAlerts(bot: $bot) {
    id
    alertsConversation {
      id
    }
    alerts {
      ...AlertFields
    }
  }
}
