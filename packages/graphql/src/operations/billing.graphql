fragment PlanFields on Plan {
  key
  name
  priceCents
  jobs
  messages
  agents
}

fragment BillingFields on Billing {
  configured
  status
  currentPeriodEnd
  cancelAtPeriodEnd
  hasCustomer
  plan {
    ...PlanFields
  }
  limits {
    jobs
    messages
  }
  credits {
    jobs
    messages
  }
  used {
    jobs
    messages
  }
}

query Billing {
  billing {
    ...BillingFields
  }
  plans {
    ...PlanFields
  }
}

mutation StartCheckout($plan: PlanKey) {
  startCheckout(plan: $plan)
}

mutation OpenBillingPortal {
  openBillingPortal
}

mutation RedeemUsageCode($code: String!) {
  redeemUsageCode(code: $code) {
    ...BillingFields
  }
}
