<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/caveman.svg" />
    <title>%APP_NAME%</title>
    <!-- The app's theme before the first paint (lib/theme.ts); the landing page and sign-in stay light. -->
    <script>
      try {
        var theme = localStorage.getItem('zapbots.theme');
        var dark =
          theme === 'dark' ||
          (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark && !/^\/(landing|sign-in)/.test(location.pathname)) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {}
    </script>
    <!-- Shown until React mounts; `Splash` in src/components/Logo.tsx keeps the same look. -->
    <style>
      #boot {
        display: grid;
        min-height: 100svh;
        place-items: center;
        background: #f6f1e7;
        color: #111113;
      }
      .dark #boot {
        background: #1d1a16;
        color: #f1e9da;
      }
      #boot div {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }
      #boot span {
        position: relative;
        display: block;
        overflow: hidden;
        width: 120px;
        height: 3px;
        border-radius: 3px;
        background: rgb(15 27 42 / 0.12);
      }
      #boot span::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 3px;
        background: #0f1b2a;
        animation: boot-bar 1.1s ease-in-out infinite;
      }
      @keyframes boot-bar {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status">
        <div>
          <img src="/caveman.svg" width="64" height="64" alt="%APP_NAME%" />
          <span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
